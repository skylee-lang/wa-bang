<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>와방 · 문의 상세 (중개사용)</title>
<link rel="icon" type="image/png" href="../Favicon.png">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
<script>
if(window.tailwind)tailwind.config={theme:{extend:{fontFamily:{sans:['-apple-system','BlinkMacSystemFont','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR','Roboto','Helvetica Neue','Segoe UI','sans-serif']}}}}
</script>
<style>
  body{-webkit-tap-highlight-color:transparent}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
  .snap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.snap>*{flex:0 0 100%;scroll-snap-align:start}
  /* 기기 기본 한글 글꼴: 아이폰·맥(애플 SD 고딕) / 갤럭시(삼성 기본·Noto) / 윈도우(맑은 고딕) */
  html,body,button,input,textarea,select{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",Roboto,"Helvetica Neue","Segoe UI",sans-serif}
</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
<script>
/* ============ 설정 ============ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycby-lThcqgEl1Ge4eDPhKhwEL5AMO_YjYrHujkMdNhAhq7yYZq2L9UW1iGR-52nN5DDgig/exec",                       // 비워두면 시트 '상세페이지' 링크에 들어있는 주소를 자동 사용
  AGENT_NAME: "와방 공인중개사 이하늘",  // 손님에게 보내는 오픈카톡 답장 문구에 들어갈 이름
  SITE_URL: "../"                    // 매물 사이트 (손님 화면)
};
</script>

<div class="max-w-md mx-auto min-h-screen bg-slate-50 pb-28">
  <header class="sticky top-0 z-30 bg-slate-900 text-white px-4 py-3" style="padding-top:max(.75rem,env(safe-area-inset-top))">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2"><i class="ph-fill ph-lock-key text-sky-300"></i><span class="font-extrabold">와방 · 문의 상세</span></div>
      <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-white/10 text-sky-200">중개사 전용</span>
    </div>
  </header>
  <div id="app" class="p-4 space-y-4">
    <div class="py-20 text-center text-sm text-slate-500"><div class="w-9 h-9 border-4 border-sky-200 border-t-sky-500 rounded-full animate-spin mx-auto mb-3"></div>문의 정보를 불러오는 중...</div>
  </div>
</div>

<!-- 하단 고정 행동 버튼 -->
<div id="actionBar" class="hidden fixed bottom-0 inset-x-0 z-40" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-md mx-auto px-4 pb-3 pt-2 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent">
    <!-- 손님 전화번호는 받지 않음 → 답장은 오픈카톡에서. 답장 문구를 복사해 두면 붙여넣기만 하면 됨 -->
    <button type="button" id="aReply" class="w-full py-3.5 rounded-2xl bg-[#FEE500] text-[#191919] text-sm font-extrabold flex items-center justify-center gap-1.5 shadow-lg"><i class="ph-fill ph-chat-teardrop-text"></i>오픈카톡 답장 문구 복사</button>
  </div>
</div>
<div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-lg w-max max-w-[90%] text-center"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Q=new URLSearchParams(location.search), ID=Q.get("id"), KEY=Q.get("k");
let API=CONFIG.API_URL||Q.get("api")||"";
try{if(API)localStorage.setItem("wabang_api",API);else API=localStorage.getItem("wabang_api")||""}catch(e){}
const IS_IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add("hidden"),2500)}

/* ---------- 금액/조건 비교 ---------- */
const money=v=>{const n=parseFloat(String(v??"").replace(/,/g,"").replace(/[^0-9.]/g,""));return isNaN(n)?0:n};
function krMoney(s){s=String(s||"").replace(/,/g,"").replace(/\s/g,"");
  const m=s.match(/(\d+(?:\.\d+)?)억(?:(\d+)(천)?)?/);if(m)return parseFloat(m[1])*10000+(m[2]?(m[3]?parseInt(m[2])*1000:parseInt(m[2])):0);
  const k=s.match(/(\d+(?:\.\d+)?)천/);if(k)return parseFloat(k[1])*1000;const n=s.match(/\d+(?:\.\d+)?/);return n?parseFloat(n[0]):null}
function won(n){const w=Math.round(n*10000);if(!w)return "0";const e=Math.floor(w/1e8),m=Math.floor((w%1e8)/1e4);return [e&&e+"억",m&&m.toLocaleString()+(e?"":"만")].filter(Boolean).join(" ")}
const norm=k=>String(k).replace(/\([^)]*\)/g,"").replace(/\s/g,"");
function pick(o,names){if(!o)return "";for(const k of Object.keys(o))if(names.includes(norm(k)))return String(o[k]).trim();return ""}
const TYPE_WORDS=["아파트","오피스텔","원룸","투룸","쓰리룸","상가"];

function compare(L,c){
  const out=[], type=pick(L,["매물종류"]), deal=pick(L,["거래유형"]), memo=pick(L,["한줄특징","특징","메모"]);
  const dep=money(pick(L,["보증금"])), rent=money(pick(L,["월세"])), jeon=money(pick(L,["전세금"])), sale=money(pick(L,["매매가"]));
  const add=(lv,t)=>out.push([lv,t]);
  if(c.structure){const want=TYPE_WORDS.filter(w=>c.structure.includes(w));if(want.length)add(want.some(w=>type.includes(w))?"ok":"no","구조 "+(type||"-"))}
  const mr=String(c.monthlyRent||"").replace(/\s/g,""), jeonWant=/전세|매매/.test(mr);
  if(c.deposit&&!/이상|무관|상관/.test(c.deposit)){const max=krMoney(c.deposit),v=jeonWant&&!dep?(jeon||sale):dep;
    if(max&&v)add(v<=max?"ok":"no",`보증금 ${won(v)} (예산 ${won(max)})`)}
  if(!jeonWant&&rent){const ns=(mr.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
    if(ns.length){if(/이상|초과/.test(mr))add(rent>=ns[0]?"ok":"mid",`월세 ${rent}만`);else{const max=ns[ns.length-1];add(rent<=max?"ok":rent<=max*1.1?"mid":"no",`월세 ${rent}만 (희망 ~${max}만)`)}}}
  if(jeonWant)add(/전세|매매/.test(deal)||jeon||sale?"ok":"no","거래 "+(deal||"-"));
  if(c.pet&&!/없/.test(c.pet)){const p=pick(L,["반려동물","반려동물여부","펫"]);add(/가능/.test(p)?"ok":/협의/.test(p)?"mid":/불가/.test(p)?"no":"mid","반려동물 "+(p||"확인 필요"))}
  if(c.parking&&!/불필요|없/.test(c.parking))add(/주차/.test(memo)?"ok":"mid",/주차/.test(memo)?"주차 언급 있음":"주차 확인 필요");
  if(c.adminFee&&/포함/.test(c.adminFee)){const f=pick(L,["관리비"]);add(/포함/.test(f)?"ok":"mid","관리비 "+(f||"확인 필요"))}
  return out;
}
const LV={ok:["bg-emerald-50 text-emerald-700 border-emerald-200","✓"],mid:["bg-amber-50 text-amber-700 border-amber-200","△"],no:["bg-rose-50 text-rose-700 border-rose-200","✗"]};
function driveThumb(u){u=u.trim();const m=u.match(/[?&]id=([\w-]+)/)||u.match(/\/d\/([\w-]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w800":u}

/* ---------- 화면 ---------- */
const CHAT_LABELS=[["moveInDate","입주 시기"],["structure","구조"],["budget","예산"],["needs","꼭 필요한 조건"],["location","동네"],["viewingDate","방 볼 수 있는 날"],
  ["deposit","보증금"],["monthlyRent","월세"],["adminFee","관리비"],["parking","주차"],["pet","반려동물"],["options","옵션"],["priority","중요하게 보는 것"]];
const chatLabelsFor=c=>CHAT_LABELS.filter(([k])=>c[k]&&!(c.budget&&["deposit","monthlyRent"].includes(k))&&!(c.needs&&["pet","parking","options"].includes(k)));
const isUrgent=c=>/즉시|1개월|이번\s*달|급/.test(String((c||{}).moveInDate||""));
let DATA=null;

function render(){
  const {inquiry:q,listings,statuses}=DATA, c=q.chat||{};
  const listingCards=(q.items||[]).map((it,i)=>{
    const L=listings.find(l=>l.id===String(it.id))||{}, pub=L.pub, priv=L.priv;
    const photos=pub?pick(pub,["사진"]).split(",").map(s=>s.trim()).filter(Boolean).map(driveThumb):[];
    const status=pub?pick(pub,["상태"]):"";
    const cmp=pub?compare(pub,c):[];
    const okN=cmp.filter(x=>x[0]==="ok").length;
    return `<article class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
      ${photos.length?`<div class="snap no-scrollbar aspect-[16/10] bg-slate-100">${photos.map(p=>`<img src="${esc(p)}" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.remove()">`).join("")}</div>`:""}
      <div class="p-4 space-y-3">
        <div class="flex items-start justify-between gap-2">
          <div><div class="text-[11px] font-bold text-slate-500">${"①②③④⑤⑥⑦⑧⑨⑩"[i]||i+1} 매물 #${esc(it.id)} ${status?`· <span class="${/완료/.test(status)?"text-rose-600":"text-emerald-600"}">${esc(status)}</span>`:""}</div>
            <div class="text-base font-extrabold text-slate-900 leading-snug">${esc(it.short||it.area)}</div>
            <div class="text-sm font-bold text-sky-700">${esc(it.price||"")}</div></div>
          ${cmp.length?`<div class="shrink-0 text-center px-2.5 py-1.5 rounded-xl bg-slate-900 text-white"><div class="text-[10px] font-bold text-slate-300">조건 일치</div><div class="text-sm font-extrabold">${okN}/${cmp.length}</div></div>`:""}
        </div>
        ${!pub?`<div class="text-xs p-2.5 rounded-xl bg-amber-50 text-amber-800 border border-amber-200">시트에서 이 매물을 못 찾았어요 (삭제됐거나 번호가 바뀜). 아래는 손님이 볼 때의 정보예요.</div>`:""}
        ${cmp.length?`<div class="flex flex-wrap gap-1.5">${cmp.map(([lv,t])=>`<span class="px-2 py-1 rounded-lg border text-[11px] font-bold ${LV[lv][0]}">${LV[lv][1]} ${esc(t)}</span>`).join("")}</div>`:""}
        ${priv?`<div class="rounded-2xl bg-yellow-50 border border-yellow-200 p-3">
            <div class="text-[11px] font-extrabold text-yellow-800 mb-1.5 flex items-center gap-1"><i class="ph-fill ph-lock-key"></i>중개사만 보는 정보 (관리용 탭)</div>
            <dl class="grid grid-cols-[auto,1fr] gap-x-3 gap-y-1 text-xs">${Object.entries(priv).filter(([k])=>!/^(매물번호|번호|ID|id)$/.test(norm(k))).map(([k,v])=>`<dt class="font-bold text-yellow-900 whitespace-nowrap">${esc(k)}</dt><dd class="text-slate-800 break-all">${/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(String(v).trim())?`<a class="underline font-bold" href="tel:${esc(String(v).replace(/[^0-9]/g,""))}">${esc(v)}</a>`:esc(v)}</dd>`).join("")}</dl></div>`
          :`<div class="text-[11px] text-slate-400">🔒 '관리용' 탭에 이 매물번호로 상세주소·임대인 연락처 등을 적어두면 여기에 보여요.</div>`}
        ${pub?`<details class="text-xs"><summary class="font-bold text-slate-500 cursor-pointer">시트 원본 정보</summary><dl class="mt-2 grid grid-cols-[auto,1fr] gap-x-3 gap-y-1">${Object.entries(pub).filter(([k])=>norm(k)!=="사진").map(([k,v])=>`<dt class="font-bold text-slate-500 whitespace-nowrap">${esc(k)}</dt><dd class="break-all">${esc(v)}</dd>`).join("")}</dl></details>`:""}
        <a href="${esc(CONFIG.SITE_URL)}?item=${encodeURIComponent(it.id)}" target="_blank" class="block text-center py-2 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">손님이 보는 화면으로 보기</a>
      </div></article>`}).join("");

  $("app").innerHTML=`
    <section class="bg-white rounded-3xl border border-slate-200 p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="text-xs font-bold text-slate-500">문의 #${esc(q.id)} · ${esc(q.time)}</div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <div><div class="text-xl font-extrabold text-slate-900">문의번호 ${esc(q.id)} ${isUrgent(c)?`<span class="align-middle ml-1 px-2 py-0.5 rounded-lg bg-rose-500 text-white text-xs font-extrabold">🔥 입주 급함</span>`:""}</div>
          <div class="text-xs font-bold text-slate-500 mt-0.5">${esc(q.via||"오픈카톡")}로 보낸 손님</div></div>
      </div>
      <div class="text-xs p-3 rounded-2xl bg-yellow-50 border border-yellow-200 text-yellow-900 leading-relaxed break-keep">
        💬 오픈카톡 대화 목록에서 <b>'문의번호 ${esc(String(q.id).replace(/-\d+$/,""))}'</b>로 시작하는 메시지를 보낸 손님이에요. 그 대화방에 답장해 주세요.<br>
        <span class="text-yellow-700">그런 메시지가 없으면 손님이 보내기 전에 나간 거라 연락할 방법이 없어요 → 처리 상태를 '종료'로.</span>
      </div>
      ${q.message?`<details class="text-xs"><summary class="font-bold text-slate-500 cursor-pointer">손님이 보낸 글 그대로 보기</summary><pre class="mt-2 p-3 rounded-xl bg-slate-50 border border-slate-100 whitespace-pre-wrap break-words font-sans leading-relaxed text-slate-700">${esc(q.message)}</pre></details>`:""}
      <div class="grid grid-cols-2 gap-2">
        <div class="p-3 rounded-2xl bg-sky-50 border border-sky-100"><div class="text-[11px] font-bold text-sky-700">📅 방 보기 가능</div><div class="text-sm font-extrabold">${esc(c.viewingDate||"-")}</div></div>
        <div class="p-3 rounded-2xl ${isUrgent(c)?"bg-rose-50 border-rose-200":"bg-sky-50 border-sky-100"} border"><div class="text-[11px] font-bold ${isUrgent(c)?"text-rose-700":"text-sky-700"}">🚚 입주 희망</div><div class="text-sm font-extrabold">${esc(c.moveInDate||"-")}</div></div>
      </div>
      <div>
        <div class="text-[11px] font-bold text-slate-500 mb-1.5">처리 상태 (누르면 시트에 자동 기록)</div>
        <div id="statusBox" class="flex gap-1.5 overflow-x-auto no-scrollbar">${statuses.map(s=>`<button type="button" data-s="${esc(s)}" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border">${esc(s)}</button>`).join("")}</div>
      </div>
    </section>

    <section class="space-y-3">
      <h2 class="text-sm font-extrabold text-slate-700 px-1">❤️ 손님이 고른 매물 ${(q.items||[]).length}개</h2>
      ${listingCards||`<div class="p-4 rounded-3xl bg-white border border-dashed border-slate-300 text-sm text-slate-600 leading-relaxed">고른 매물 없이 <b>조건만</b> 보낸 문의예요.<br>아래 버튼으로 이 손님 조건에 맞는 매물을 바로 찾아보세요.</div>`}
      <a href="${esc(CONFIG.SITE_URL)}?chat=${encodeURIComponent(JSON.stringify(c))}" target="_blank" class="flex items-center justify-center gap-1.5 py-3 rounded-2xl bg-white border border-sky-200 text-sky-700 text-sm font-extrabold"><i class="ph-bold ph-magnifying-glass"></i>이 손님 조건으로 다른 매물 찾기</a>
    </section>

    <section class="bg-white rounded-3xl border border-slate-200 p-4 shadow-sm">
      <h2 class="text-sm font-extrabold text-slate-700 mb-2">💬 희망 조건 (챗봇)</h2>
      ${chatLabelsFor(c).length?`<dl class="grid grid-cols-[auto,1fr] gap-x-3 gap-y-1.5 text-sm">${chatLabelsFor(c).map(([k,l])=>`<dt class="text-slate-500 font-semibold whitespace-nowrap">${l}</dt><dd class="font-bold text-slate-800">${esc(c[k])}</dd>`).join("")}</dl>`:`<p class="text-xs text-slate-500">챗봇을 거치지 않은 문의예요.</p>`}
    </section>

    <section class="bg-white rounded-3xl border border-slate-200 p-4 shadow-sm">
      <h2 class="text-sm font-extrabold text-slate-700 mb-2">📝 메모 (시트에 저장)</h2>
      <textarea id="memo" rows="3" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-base focus:outline-none focus:border-sky-400" placeholder="예: 토요일 2시 101호 투어 예약, 임대인 확인 완료">${esc(q.memo||"")}</textarea>
      <button type="button" id="saveMemo" class="mt-2 w-full py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold">메모 저장</button>
    </section>`;

  drawStatus(q.status);
  $("statusBox").querySelectorAll("button").forEach(b=>b.onclick=()=>update({status:b.dataset.s},()=>{q.status=b.dataset.s;drawStatus(q.status);toast(`'${b.dataset.s}'(으)로 바꿨어요`)}));
  $("saveMemo").onclick=()=>update({memo:$("memo").value},()=>{q.memo=$("memo").value;toast("메모를 저장했어요")});
  // 하단 버튼: 오픈카톡 답장 문구 복사 (누르면 '신규' → '연락함' 자동 변경)
  const ids=(q.items||[]).map(x=>`#${x.id} ${x.short?x.short.split(" · ")[0]:x.area}`).join(", ");
  const reply=`안녕하세요, ${CONFIG.AGENT_NAME}입니다 😊\n`+
    (ids?`문의주신 ${ids} 매물 확인했어요.\n`:`보내주신 조건 확인했어요. 맞는 매물 바로 찾아드릴게요.\n`)+
    (c.viewingDate?`말씀하신 '${c.viewingDate}'에 보실 수 있게 일정 잡아드릴게요. 편하신 시간 알려주세요!`:`방 보실 수 있는 날짜와 시간 알려주시면 일정 잡아드릴게요!`);
  $("aReply").onclick=()=>copyText(reply).then(ok=>{
    toast(ok?"복사했어요! 오픈카톡 대화방에 붙여넣으세요":"복사가 막혔어요. '손님이 보낸 글' 아래 문구를 직접 복사해 주세요");
    if(q.status==="신규")update({status:"연락함"},()=>{q.status="연락함";drawStatus(q.status)});
  });
  $("actionBar").classList.remove("hidden");
}
function copyText(t){
  let ok=false;const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0.01;font-size:16px";document.body.appendChild(ta);
  try{ta.select();ta.setSelectionRange(0,t.length);ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  if(ok)return Promise.resolve(true);
  try{return navigator.clipboard.writeText(t).then(()=>true,()=>false)}catch(e){return Promise.resolve(false)}
}
function drawStatus(cur){
  $("statusBox").querySelectorAll("button").forEach(b=>{const on=b.dataset.s===cur;
    b.className="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition "+(on?"bg-sky-600 text-white border-sky-600":"bg-white text-slate-600 border-slate-200")});
}
async function update(params,done){
  try{const r=await fetch(API+"?"+new URLSearchParams({api:"update",id:ID,k:KEY,...params}));const j=await r.json();
    if(!j.ok)throw new Error(j.error);done&&done()}
  catch(e){toast("저장이 안 됐어요. 인터넷 연결을 확인해 주세요.")}
}
function fail(t,d){$("app").innerHTML=`<div class="py-16 text-center"><div class="text-4xl mb-3">🔒</div><div class="font-extrabold text-slate-800 mb-1">${esc(t)}</div><p class="text-xs text-slate-500 leading-relaxed">${esc(d)}</p></div>`}

(async function(){
  if(!ID||!KEY)return fail("문의 링크가 아니에요","시트의 '상세페이지' 링크로 들어와 주세요.");
  if(!API)return fail("서버 주소가 없어요","시트의 '상세페이지' 링크로 다시 들어와 주세요.");
  try{
    const r=await fetch(API+"?"+new URLSearchParams({api:"inquiry",id:ID,k:KEY}));const j=await r.json();
    if(!j.ok)return fail("문의를 열 수 없어요",j.error||"");
    DATA=j;document.title=`문의 ${j.inquiry.id} | 와방`;render();
  }catch(e){fail("불러오지 못했어요","잠시 후 새로고침해 주세요. ("+(e.message||e)+")")}
})();
</script>
